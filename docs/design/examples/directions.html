<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tadooer design directions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Oswald:wght@500;600&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
      }
      body {
        font:
          14px/1.5 "Inter",
          system-ui,
          sans-serif;
        color: var(--foreground, #e5e7eb);
      }
      .wrap {
        display: flex;
        flex-direction: column;
        gap: 40px;
        padding: 4px 0 24px;
      }
      .direction > h2 {
        font:
          600 18px/1.3 "Inter",
          system-ui,
          sans-serif;
        margin: 0 0 4px;
      }
      .direction > p.lede {
        margin: 0 0 12px;
        color: var(--muted-foreground, #9aa3b2);
        max-width: 64ch;
      }
      .direction .letter {
        display: inline-block;
        min-width: 1.6em;
        text-align: center;
        border-radius: 6px;
        padding: 0 6px;
        margin-right: 6px;
        font-weight: 700;
        background: var(--accent, #333);
        color: var(--accent-foreground, #fff);
      }

      /* ---------- shared mock structure ---------- */
      .mock {
        --ui: 12px;
        width: 100%;
        box-sizing: border-box;
        border-radius: var(--m-radius-lg);
        overflow: hidden;
        background: var(--m-crust);
        border: 1px solid var(--m-line-strong);
        font-family: var(--m-font-body);
        font-size: var(--ui);
        color: var(--m-text);
        line-height: 1.45;
        display: grid;
        grid-template-columns: 148px 1fr;
      }
      .mock * {
        box-sizing: border-box;
      }
      .mono {
        font-family: var(--m-font-mono);
        font-variant-numeric: tabular-nums;
      }
      .eyebrow {
        font-family: var(--m-font-mono);
        font-size: 9.5px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--m-subtext-2);
        font-weight: 600;
      }
      .side {
        background: var(--m-mantle);
        border-right: 1px solid var(--m-line);
        padding: 12px 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 6px 6px;
        font-family: var(--m-font-display);
        font-weight: var(--m-display-weight);
        font-size: 14px;
        letter-spacing: var(--m-display-tracking);
        text-transform: var(--m-display-case);
      }
      .mark {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--m-crust);
        border: 1px solid var(--m-line-strong);
        position: relative;
        flex: none;
      }
      .mark i {
        position: absolute;
        left: 5px;
        height: 2px;
        background: var(--m-subtext);
        border-radius: 1px;
      }
      .mark i:nth-child(1) {
        top: 5px;
        width: 11px;
      }
      .mark i:nth-child(2) {
        top: 10px;
        width: 7px;
      }
      .mark i:nth-child(3) {
        top: 15px;
        width: 11px;
      }
      .mark b {
        position: absolute;
        right: 3px;
        top: 7px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--m-primary);
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 7px;
        border-radius: var(--m-radius-sm);
        color: var(--m-subtext);
        text-decoration: none;
      }
      .nav a svg {
        width: 13px;
        height: 13px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav a.on {
        background: var(--m-primary-tint);
        color: var(--m-primary);
        font-weight: 600;
      }
      .sync {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 10.5px;
        color: var(--m-subtext);
        padding: 0 6px;
      }
      .sync::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--m-success);
      }
      .main {
        background: var(--m-base);
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        border-bottom: 1px solid var(--m-line);
        background: var(--m-mantle);
      }
      .top .crumb {
        color: var(--m-subtext);
      }
      .top .acts {
        display: flex;
        gap: 6px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: var(--m-control);
        padding: 0 9px;
        border-radius: var(--m-radius-sm);
        border: 1px solid var(--m-line-strong);
        background: var(--m-surface-1);
        color: var(--m-text);
        font: 500 11px/1 var(--m-font-body);
        white-space: nowrap;
      }
      .btn.pri {
        background: var(--m-primary);
        border-color: var(--m-primary);
        color: var(--m-primary-fg);
        font-weight: 600;
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--m-subtext);
      }
      .btn.danger {
        background: transparent;
        color: var(--m-danger);
        border-color: var(--m-line-strong);
      }
      .btn kbd {
        font-family: var(--m-font-mono);
        font-size: 9.5px;
        color: var(--m-subtext-2);
        border: 1px solid var(--m-line-strong);
        border-radius: 3px;
        padding: 1px 3px;
      }
      .page {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 11px;
      }
      .page h1 {
        margin: 2px 0 0;
        font-family: var(--m-font-display);
        font-weight: var(--m-display-weight);
        font-size: 21px;
        letter-spacing: var(--m-display-tracking);
        text-transform: var(--m-display-case);
        line-height: 1.15;
      }
      .page .sub {
        color: var(--m-subtext);
        margin: 2px 0 0;
      }
      .page .hint {
        color: var(--m-subtext-2);
        font-size: 11px;
        margin: 1px 0 0;
      }
      .capture {
        display: flex;
        gap: 6px;
      }
      .input {
        flex: 1;
        height: var(--m-control);
        border: 1px solid var(--m-line-strong);
        border-radius: var(--m-radius-sm);
        background: var(--m-mantle);
        color: var(--m-subtext-2);
        padding: 0 9px;
        display: flex;
        align-items: center;
      }
      .card {
        background: var(--m-surface-0);
        border: 1px solid var(--m-line);
        border-radius: var(--m-radius-lg);
        padding: 11px 12px;
      }
      .focus {
        border-color: var(--m-primary);
        box-shadow: 0 0 0 1px var(--m-primary-tint) inset;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
      }
      .focus .title {
        font-weight: 600;
        margin-top: 2px;
      }
      .focus .timer {
        font-family: var(--m-font-mono);
        font-size: 22px;
        color: var(--m-now);
        font-weight: 600;
        line-height: 1;
      }
      .focus .label {
        color: var(--m-now);
        font-size: 10.5px;
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 3px;
      }
      .focus .label::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--m-now);
      }
      .focus .acts {
        grid-column: 1 / -1;
        display: flex;
        gap: 6px;
      }
      .rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 8px;
        padding: 8px 11px;
        border-radius: var(--m-radius-md);
        background: var(--m-surface-0);
        border: 1px solid var(--m-line);
      }
      .row strong {
        font-weight: 600;
        display: block;
      }
      .row .meta {
        color: var(--m-subtext);
        font-size: 11px;
        font-family: var(--m-font-mono);
      }
      .row.done strong {
        text-decoration: line-through;
        color: var(--m-subtext-2);
      }
      .row .acts {
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 7px;
        border-radius: 999px;
        font-family: var(--m-font-mono);
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        border: 1px solid transparent;
      }
      .chip.warn {
        background: var(--m-warning-tint);
        color: var(--m-warning);
      }
      .chip.ok {
        background: var(--m-success-tint);
        color: var(--m-success);
      }
      .chip.info {
        background: var(--m-info-tint);
        color: var(--m-info);
      }
      .chip.cal {
        background: var(--m-calendar-tint);
        color: var(--m-calendar);
      }
      .chip.danger {
        background: var(--m-danger-tint);
        color: var(--m-danger);
      }
      .chip.neutral {
        background: var(--m-surface-1);
        color: var(--m-subtext);
      }
      .chip.pri {
        background: var(--m-primary-tint);
        color: var(--m-primary);
      }
      .sec {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .sec h2 {
        margin: 0;
        font-family: var(--m-font-display);
        font-weight: var(--m-display-weight);
        font-size: 14px;
        letter-spacing: var(--m-display-tracking);
        text-transform: var(--m-display-case);
      }
      .tl {
        display: grid;
        grid-template-columns: 44px 1fr;
        gap: 4px 8px;
      }
      .tl .t {
        font-family: var(--m-font-mono);
        font-size: 10.5px;
        color: var(--m-subtext-2);
        text-align: right;
        padding-top: 3px;
      }
      .tl .ev {
        padding: 5px 8px;
        border-radius: var(--m-radius-sm);
        border-left: 3px solid var(--m-calendar);
        background: var(--m-calendar-tint);
        font-size: 11px;
      }
      .tl .ev.g {
        border-left-color: var(--m-info);
        background: var(--m-info-tint);
      }
      .tl .ev.block {
        border-left-color: var(--m-primary);
        background: var(--m-primary-tint);
      }
      .tl .now {
        grid-column: 1 / -1;
        height: 0;
        border-top: 2px solid var(--m-now);
        position: relative;
        margin: 1px 0;
      }
      .tl .now::before {
        content: "14:07";
        position: absolute;
        left: -2px;
        top: -7px;
        background: var(--m-now);
        color: var(--m-crust);
        font: 600 9px/1 var(--m-font-mono);
        padding: 2px 4px;
        border-radius: 3px;
      }
      .states {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      /* ---------- token sheet ---------- */
      .sheet {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px 24px;
        margin-top: 12px;
        font-size: 13px;
      }
      .sheet h3 {
        font:
          600 11px/1 "Inter",
          system-ui,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted-foreground, #9aa3b2);
        margin: 0 0 6px;
      }
      .swatches {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .sw {
        display: flex;
        align-items: center;
        gap: 6px;
        font:
          11px/1 "JetBrains Mono",
          monospace;
        color: var(--muted-foreground, #9aa3b2);
      }
      .sw i {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        border: 1px solid rgba(128, 128, 128, 0.35);
        display: inline-block;
      }
      .sheet ul {
        margin: 0;
        padding-left: 16px;
      }
      .sheet li {
        margin: 2px 0;
      }
      .sheet code {
        font:
          11px "JetBrains Mono",
          monospace;
      }
      @media (max-width: 560px) {
        .sheet {
          grid-template-columns: 1fr;
        }
        .mock {
          grid-template-columns: 1fr;
        }
        .side {
          display: none;
        }
      }

      /* ---------- A: Planner night (Mocha + Dracula) ---------- */
      .A {
        --m-crust: #11111b;
        --m-mantle: #181825;
        --m-base: #1e1e2e;
        --m-surface-0: #252538;
        --m-surface-1: #313244;
        --m-line: #2e2e44;
        --m-line-strong: #3a3a54;
        --m-text: #e2e6f6;
        --m-subtext: #a6adc8;
        --m-subtext-2: #7f849c;
        --m-primary: #bd93f9;
        --m-primary-fg: #11111b;
        --m-now: #ff79c6;
        --m-info: #8be9fd;
        --m-calendar: #94e2d5;
        --m-success: #50fa7b;
        --m-warning: #ffb86c;
        --m-danger: #ff5555;
        --m-primary-tint: color-mix(in srgb, #bd93f9 14%, transparent);
        --m-success-tint: color-mix(in srgb, #50fa7b 13%, transparent);
        --m-warning-tint: color-mix(in srgb, #ffb86c 14%, transparent);
        --m-danger-tint: color-mix(in srgb, #ff5555 13%, transparent);
        --m-info-tint: color-mix(in srgb, #8be9fd 13%, transparent);
        --m-calendar-tint: color-mix(in srgb, #94e2d5 14%, transparent);
        --m-font-display: "Inter", system-ui, sans-serif;
        --m-font-body: "Inter", system-ui, sans-serif;
        --m-font-mono: "Atkinson Hyperlegible Mono", ui-monospace, monospace;
        --m-display-weight: 650;
        --m-display-tracking: -0.015em;
        --m-display-case: none;
        --m-radius-sm: 5px;
        --m-radius-md: 8px;
        --m-radius-lg: 12px;
        --m-control: 30px;
      }
      /* ---------- B: Terminal ledger (Subcult OS family) ---------- */
      .B {
        --m-crust: #000000;
        --m-mantle: #070709;
        --m-base: #0b0b0f;
        --m-surface-0: #131318;
        --m-surface-1: #1c1c24;
        --m-line: #232330;
        --m-line-strong: #32323f;
        --m-text: #ffffff;
        --m-subtext: #b8b8c6;
        --m-subtext-2: #7f7f92;
        --m-primary: #9d6bff;
        --m-primary-fg: #000000;
        --m-now: #ff5fb4;
        --m-info: #00ffff;
        --m-calendar: #5ee0c8;
        --m-success: #00ff88;
        --m-warning: #ffb347;
        --m-danger: #ff4d4d;
        --m-primary-tint: color-mix(in srgb, #9d6bff 16%, transparent);
        --m-success-tint: color-mix(in srgb, #00ff88 12%, transparent);
        --m-warning-tint: color-mix(in srgb, #ffb347 14%, transparent);
        --m-danger-tint: color-mix(in srgb, #ff4d4d 13%, transparent);
        --m-info-tint: color-mix(in srgb, #00ffff 11%, transparent);
        --m-calendar-tint: color-mix(in srgb, #5ee0c8 13%, transparent);
        --m-font-display: "Oswald", system-ui, sans-serif;
        --m-font-body: "Space Mono", ui-monospace, monospace;
        --m-font-mono: "Space Mono", ui-monospace, monospace;
        --m-display-weight: 600;
        --m-display-tracking: 0.04em;
        --m-display-case: uppercase;
        --m-radius-sm: 4px;
        --m-radius-md: 8px;
        --m-radius-lg: 8px;
        --m-control: 30px;
      }
      .B .mock {
        --ui: 11.5px;
      }
      .B .chip {
        border-radius: 3px;
      }
      .B .btn {
        border-radius: 3px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 10px;
        font-family: var(--m-font-mono);
      }
      .B .row,
      .B .card {
        border-left: 2px solid var(--m-line-strong);
      }
      .B .focus {
        border-left-color: var(--m-primary);
      }
      /* ---------- C: Paper desk (Prichal / Dedhed paper family, Tadooer purple) ---------- */
      .C {
        --m-crust: #e9e4d6;
        --m-mantle: #f1ede2;
        --m-base: #f6f3ea;
        --m-surface-0: #fbf9f3;
        --m-surface-1: #ebe6d9;
        --m-line: #dcd6c6;
        --m-line-strong: #c9c2b0;
        --m-text: #1c2230;
        --m-subtext: #4d5566;
        --m-subtext-2: #737b8c;
        --m-primary: #6a3fd6;
        --m-primary-fg: #ffffff;
        --m-now: #c8247b;
        --m-info: #0b6e8f;
        --m-calendar: #0f7a69;
        --m-success: #1d7a3e;
        --m-warning: #a85b00;
        --m-danger: #b23a26;
        --m-primary-tint: color-mix(in srgb, #6a3fd6 12%, transparent);
        --m-success-tint: color-mix(in srgb, #1d7a3e 12%, transparent);
        --m-warning-tint: color-mix(in srgb, #a85b00 13%, transparent);
        --m-danger-tint: color-mix(in srgb, #b23a26 12%, transparent);
        --m-info-tint: color-mix(in srgb, #0b6e8f 12%, transparent);
        --m-calendar-tint: color-mix(in srgb, #0f7a69 12%, transparent);
        --m-font-display: "Space Grotesk", system-ui, sans-serif;
        --m-font-body: "Public Sans", system-ui, sans-serif;
        --m-font-mono: "JetBrains Mono", ui-monospace, monospace;
        --m-display-weight: 700;
        --m-display-tracking: -0.02em;
        --m-display-case: none;
        --m-radius-sm: 6px;
        --m-radius-md: 10px;
        --m-radius-lg: 14px;
        --m-control: 32px;
      }
      .C .mock {
        box-shadow: 0 1px 0 rgba(28, 34, 48, 0.06);
      }
      .C .card,
      .C .row {
        box-shadow: 0 1px 2px rgba(28, 34, 48, 0.06);
      }
      .C .tl .now::before {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap"></div>
    <template id="mock">
      <div class="mock">
        <aside class="side">
          <div class="brand">
            <span class="mark"><i></i><i></i><i></i><b></b></span>Tadooer
          </div>
          <nav class="nav">
            <a class="on"
              ><svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                /></svg
              >Today</a
            >
            <a
              ><svg viewBox="0 0 24 24">
                <path d="M22 12h-6l-2 3h-4l-2-3H2" />
                <path
                  d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"
                /></svg
              >Inbox</a
            >
            <a
              ><svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M16 2v4M8 2v4M3 10h18" /></svg
              >Planner</a
            >
            <a
              ><svg viewBox="0 0 24 24">
                <path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1" /></svg
              >Tasks</a
            >
            <a
              ><svg viewBox="0 0 24 24">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                <path d="M3 3v5h5" /></svg
              >Reuse</a
            >
            <a
              ><svg viewBox="0 0 24 24">
                <path d="m17 2 4 4-4 4" />
                <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
                <path d="m7 22-4-4 4-4" />
                <path d="M21 13v1a4 4 0 0 1-4 4H3" /></svg
              >Habits</a
            >
            <a
              ><svg viewBox="0 0 24 24">
                <path d="M19 7V4a1 1 0 0 0-1-1h-2a1 1 0 0 0-1 1v3" />
                <path d="M9 7V4a1 1 0 0 0-1-1H6a1 1 0 0 0-1 1v3" />
                <path
                  d="M4 7h6v4a3 3 0 0 1-6 0zM14 7h6v4a3 3 0 0 1-6 0zM7 14v7M17 14v7"
                /></svg
              >Connections</a
            >
            <a
              ><svg viewBox="0 0 24 24">
